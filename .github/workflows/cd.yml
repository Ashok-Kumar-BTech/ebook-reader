name: CD - Build & Deploy Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: ''

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test-gate:
    name: Pre-Release Quality & Integrity Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Integration Tests
        run: npm run test:integration

      - name: Run Full Test Suite
        run: npm test

      - name: Production Bundle Verification
        run: npm run build:frontend

  build-desktop:
    name: Build Desktop Artifacts (${{ matrix.os }})
    needs: test-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux Native Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            squashfs-tools \
            libfuse2

      - name: Pre-seed Linux AppImage Bundling Tools
        if: matrix.platform == 'linux'
        run: |
          mkdir -p ~/.cache/tauri
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsSL \
            https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64 \
            -o ~/.cache/tauri/AppRun-x86_64
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsSL \
            https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage \
            -o ~/.cache/tauri/linuxdeploy-x86_64.AppImage
          chmod +x ~/.cache/tauri/AppRun-x86_64 ~/.cache/tauri/linuxdeploy-x86_64.AppImage
          ls -la ~/.cache/tauri

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Desktop Binaries & Bundles
        run: npx tauri build

      - name: Package Windows Artifacts
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-pkg
          Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Copy-Item -Destination release-pkg/
          Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Copy-Item -Destination release-pkg/
          if (Test-Path "src-tauri/target/release/ebook-reader.exe") {
            Compress-Archive -Path "src-tauri/target/release/ebook-reader.exe" -DestinationPath "release-pkg/ebook-reader-windows-x64-portable.zip"
          }
          Get-ChildItem -Path release-pkg

      - name: Package Linux Artifacts
        if: matrix.platform == 'linux'
        run: |
          mkdir -p release-pkg
          find src-tauri/target/release/bundle/appimage/ -name "*.AppImage" -exec cp {} release-pkg/ \; 2>/dev/null || true
          find src-tauri/target/release/bundle/deb/ -name "*.deb" -exec cp {} release-pkg/ \; 2>/dev/null || true
          ls -la release-pkg

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts-${{ matrix.platform }}
          path: release-pkg/*

  build-android:
    name: Build Android APK (ARM64)
    needs: test-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept Licenses & Install Android Toolchain Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;26.1.10909125" "platforms;android-37.0" "build-tools;35.0.0"
          echo "NDK_HOME=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust & Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Android APK
        run: npx tauri android build --apk --target aarch64

      - name: Stage Android APK
        run: |
          mkdir -p release-pkg
          find src-tauri/gen/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} release-pkg/ \;
          ls -la release-pkg

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: release-pkg/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all compiled artifacts
        uses: actions/download-artifact@v4
        with:
          path: staged-artifacts

      - name: Stage Release Assets & Compute Checksums
        id: stage
        run: |
          mkdir -p release-dist
          # Collect all binaries, installers, and archives
          find staged-artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.apk" \) -exec cp {} release-dist/ \;

          # Include license & attribution notices per GPLv3 compliance
          cp LICENSE release-dist/LICENSE.txt
          cp NOTICE release-dist/NOTICE.txt

          # Generate SHA-256 checksums for all release binaries
          cd release-dist
          sha256sum * > SHA256SUMS.txt
          echo "Release Assets Generated:"
          ls -la

      - name: Determine Release Tag
        id: tag_info
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v1.0.0' }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          name: Release ${{ steps.tag_info.outputs.tag }}
          tag_name: ${{ steps.tag_info.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.tag_info.outputs.tag, '-alpha') || contains(steps.tag_info.outputs.tag, '-beta') || contains(steps.tag_info.outputs.tag, '-rc') }}
          generate_release_notes: true
          body: |
            ## Ebook Reader ${{ steps.tag_info.outputs.tag }}

            ### Multi-Platform Downloads
            - **Windows (x64)**:
              - NSIS Installer (`.exe`)
              - MSI Windows Installer (`.msi`)
              - Portable Archive (`.zip`)
            - **Linux (x64)**:
              - Standalone AppImage (`.AppImage`)
              - Debian / Ubuntu Package (`.deb`)
            - **Android (ARM64)**:
              - Android Application Package (`.apk`)

            ### Integrity & Verification
            All binary checksums are computed with SHA-256 and recorded in `SHA256SUMS.txt`.
            To verify an asset locally:
            ```bash
            sha256sum -c SHA256SUMS.txt --ignore-missing
            ```

            ### Open Source Licensing & Compliance
            Licensed under the **GNU General Public License v3.0 (GPL-3.0-only)**.
            Source code is published with this release in compliance with GPLv3 §6.
            See attached `LICENSE.txt` and `NOTICE.txt` for comprehensive third-party copyright notices.

